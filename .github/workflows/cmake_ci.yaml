name: Build

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-project:
    name: Build Project
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4.2.2

      - name: Install apt dependencies uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libfmt-dev libg2o-dev libopencv-dev
          version: 1.0

      - name: Build Project
        uses: threeal/cmake-action@v2.1.0
