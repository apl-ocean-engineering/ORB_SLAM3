%YAML:1.0

#--------------------------------------------------------------------------------------------
# System config
#--------------------------------------------------------------------------------------------

# When the variables are commented, the system doesn't load a previous session or not store the current one

# If the LoadFile doesn't exist, the system give a message and create a new Atlas from scratch
#System.LoadAtlasFromFile: "Session_MH01_MH02_MH03_Stereo60_Pseudo"

# The store file is created from the current session, if a file with the same name exists it is deleted
#System.SaveAtlasToFile: "Session_MH01_MH02_MH03_Stereo60_Pseudo"

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "Rectified"


#Camera.width: 1440
#Camera.height: 1080

Camera.width: 720
Camera.height: 540
Camera.newHeight: 540
Camera.newWidth: 720

# Camera 1 rectified intrinsics (downsampled 0.5x)
Camera1.fx: 582.60864905002359
Camera1.fy: 582.60864905002359
Camera1.cx: 366.29634475708008
Camera1.cy: 284.3678035736084

#Camera1.fx: 1061.90838
#Camera1.fy: 1065.08245
#Camera1.cx: 778.19368
#Camera1.cy: 553.85699

#Camera1.k1: -0.259389
#Camera1.k2: 0.203687
#Camera1.p1: 0.00066
#Camera1.p2: 0.003063

Camera1.Topic: /left/image_raw
Camera1.InfoTopic: /left/camera_info


# Camera 2 rectified intrinsics (downsampled 0.5x)
Camera2.fx: 582.60864905002359
Camera2.fy: 582.60864905002359
Camera2.cx: 366.29634475708008
Camera2.cy: 284.3678035736084

#Camera2.fx: 1060.22456  # NOT 530.11228
#Camera2.fy: 1063.51251  # NOT 531.75626
#Camera2.cx: 782.09116   # NOT 391.04558
#Camera2.cy: 582.52751   # NOT 291.26376

#Camera2.k1: -0.263264
#Camera2.k2: 0.215493
#Camera2.p1: -0.003977
#Camera2.p2: 0.000629


Camera2.Topic: /right/image_raw
Camera2.InfoTopic: /right/camera_info

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 0


Stereo.T_c1_c2: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [0.999673, -0.016254, -0.019763, 0.054755,
                0.015567, 0.999286, -0.034431, -0.001173,
                0.020308, 0.034112, 0.999212, 0.002921,
                0.000000, 0.000000, 0.000000, 1.000000]

#--------------------------------------------------------------------------------------------
#--------------------------------------------------------------------------------------------

# Distance in meters of the two cameras
Stereo.b: 0.0551


# Camera frames per second
Camera.fps: 10

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 0
# ORB Parameters
#--------------------------------------------------------------------------------------------
System.thFarPoints: 20.0
System.loopClosing: 1

Stereo.ThDepth: 5.0
# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 4000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 9

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 10
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
Viewer.imageViewScale: 1.0
Viewer.Enable: 0

#System.LoadAtlasFromFile: "./atlas"
#System.LoadAtlasFromFile: "./aq_atlas/atlas"
#System.SaveAtlasToFile: "./atlas"
